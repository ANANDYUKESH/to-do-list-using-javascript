<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do List</title>
  <style>
    body {
      font-family: sans-serif;
      background-color: rgb(25, 41, 46);
    }

    .container {
      margin: 100px auto;
      padding: 20px;
      width: 500px;
      height: auto;
      background-color: lightblue;
      border-radius: 10px;
      box-shadow: 10px 10px 10px rgba(0, 0, 0, 0.2);
      text-align: center;
    }

    .container h1 {
      margin-bottom: 20px;
    }

    #newTask {
      width: 250px;
      height: 30px;
      padding: 5px;
      margin-right: 10px;
      border-radius: 5px;
      border: 2px solid blue;
    }

    button {
      background-color: blue;
      color: whitesmoke;
      border-radius: 5px;
      width: 100px;
      height: 30px;
      border: none;
      cursor: pointer;
    }

    button:hover {
      background-color: darkblue;
    }

    #taskList {
      margin-top: 20px;
      padding: 0;
      list-style: none;
      text-align: left;
    }

    #taskList li {
      padding: 10px;
      margin-bottom: 5px;
      background-color: white;
      border-radius: 5px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    #taskList li button {
      background-color: red;
      width: 70px;
      margin-left: 10px;
    }

    #taskList li button.edit-btn {
      background-color: orange;
      margin-left: 10px;
    }

    #taskList li button:hover {
      background-color: darkred;
    }

    #taskList li button.edit-btn:hover {
      background-color: darkorange;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>To-Do List</h1>
    <input type="text" id="newTask" placeholder="Add some task">
    <button onclick="addTask()">ADD</button>
    <ul id="taskList"></ul>
  </div>
  <script>
    function addTask() {
      var task = document.getElementById("newTask").value;
      if (task) {
        var list = document.getElementById("taskList");
        var item = document.createElement("li");
        item.appendChild(document.createTextNode(task));

        // Create DELETE button
        var delButton = document.createElement("button");
        delButton.textContent = "DELETE";
        delButton.addEventListener("click", function() {
          list.removeChild(item);
        });

        // Create EDIT button
        var editButton = document.createElement("button");
        editButton.textContent = "EDIT";
        editButton.classList.add("edit-btn");
        editButton.addEventListener("click", function() {
          var newTaskText = prompt("Edit your task:", task);
          if (newTaskText) {
            item.firstChild.textContent = newTaskText;
          }
        });

        item.appendChild(delButton);
        item.appendChild(editButton);
        list.appendChild(item);

        document.getElementById("newTask").value = "";
      }
    }
  </script>
</body>
</html>
